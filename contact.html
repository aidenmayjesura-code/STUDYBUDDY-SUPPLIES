<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | StudyBuddy Supplies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="section">
    <div class="container">
      <h2 class="section-title">Contact Us</h2>
      <p class="section-subtitle">We'd love to hear from you</p>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start;">
        <div>
          <h3 style="color: var(--nav-dark-blue); font-size: 1.5rem; margin-bottom: 16px;">Get in Touch</h3>
          <p style="color: var(--nav-text); line-height: 1.7; margin-bottom: 24px;">
            Have a question about our products, delivery, or an order? Reach out to us and we'll
            respond as soon as possible.
          </p>
          <div style="margin-bottom: 20px;">
            <p style="font-weight: 700; color: var(--nav-dark-blue); margin-bottom: 4px;">Email</p>
            <p style="color: var(--nav-text); margin-bottom: 16px;">studybuddysupplies@email.com</p>
          </div>
          <div style="margin-bottom: 20px;">
            <p style="font-weight: 700; color: var(--nav-dark-blue); margin-bottom: 4px;">Phone</p>
            <p style="color: var(--nav-text); margin-bottom: 16px;">+63 912 345 6789</p>
          </div>
          <div style="margin-bottom: 20px;">
            <p style="font-weight: 700; color: var(--nav-dark-blue); margin-bottom: 4px;">Location</p>
            <p style="color: var(--nav-text); margin-bottom: 16px;">Manila, Philippines</p>
          </div>
        </div>
        <div style="background: var(--nav-light-bg); padding: 24px; border-radius: 16px; border: 1px solid #E2E8F0;">
          <form style="display: flex; flex-direction: column; gap: 16px;">
            <div class="form-group">
              <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--nav-dark-blue);">Name</label>
              <input type="text" placeholder="Your name" style="width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-family: var(--font-main); font-size: 1rem;">
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--nav-dark-blue);">Email</label>
              <input type="email" placeholder="you@example.com" style="width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-family: var(--font-main); font-size: 1rem;">
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 6px; font-weight: 600; color: var(--nav-dark-blue);">Message</label>
              <textarea rows="4" placeholder="How can we help you?" style="width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-family: var(--font-main); font-size: 1rem; resize: vertical;"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: auto; padding: 12px 28px;">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (!isLoggedIn()) {
      location.href = 'login.html';
    }
    renderHeader();
    renderFooter();
    initMobileMenu();
    updateCartBadge();
  </script>
</body>
</html>
