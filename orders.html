<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | StudyBuddy Supplies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="section">
    <div class="container">
      <h2 class="section-title">My Orders</h2>
      <p class="section-subtitle">Your order history</p>

      <div id="orders-empty" class="empty-state" style="display:none;">
        <p>You haven't placed any orders yet.</p>
        <a href="shop.html" class="btn btn-primary">Start Shopping</a>
      </div>

      <div id="orders-list" class="orders-list"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Redirect to login if not logged in
    if (!isLoggedIn()) {
      location.href = 'login.html';
    }

    renderHeader();
    renderFooter();
    initMobileMenu();
    updateCartBadge();

    const ordersList = document.getElementById('orders-list');
    const ordersEmpty = document.getElementById('orders-empty');

    const orders = getOrders();
    if (orders.length === 0) {
      ordersEmpty.style.display = 'block';
      ordersList.innerHTML = '';
    } else {
      ordersEmpty.style.display = 'none';
      ordersList.innerHTML = orders.map(order => `
        <div class="order-card">
          <div class="order-header">
            <div class="order-number">Order #${order.number}</div>
            <div class="order-date">${formatOrderDate(order.date)}</div>
            <span class="order-status status-${order.status.replace(/\s+/g, '-')}">${order.status}</span>
          </div>
          <div class="order-items">
            ${order.items.map(item => `<div>${item.name} x${item.qty} &mdash; ${formatPrice(item.subtotal)}</div>`).join('')}
          </div>
          <div class="order-total">Total: ${formatPrice(order.total)}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
